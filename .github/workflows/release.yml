name: Build Signed Release APK & Publish GitHub Release

on:
  # Every push to main builds and publishes a release, like the Browser repo.
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 1.0.2 — leave empty for auto 1.0.X)'
        required: false
        default: ''
      version_code:
        description: 'Version code (integer — leave empty to auto-increment)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ── Version ────────────────────────────────────────────────────────────
      - name: Determine version
        id: versioning
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version_code }}" ]; then
            CODE="${{ inputs.version_code }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            CODE=""
          else
            CODE=""
          fi
          if [ -n "${{ inputs.version }}" ]; then
            NAME="${{ inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME=""
          fi
          if [ -z "$NAME" ]; then
            # Patch bump from the newest tag; the first release starts at 1.0.0
            LAST=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -z "$LAST" ]; then
              NAME="1.0.0"
            else
              MAJOR=$(echo "${LAST#v}" | cut -d. -f1)
              MINOR=$(echo "${LAST#v}" | cut -d. -f2)
              PATCH=$(echo "${LAST#v}" | cut -d. -f3)
              NAME="${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi
          fi
          if [ -z "$CODE" ]; then
            CODE=$(git rev-list --count HEAD)
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Releasing $NAME ($CODE)"

      # ── Signing material ───────────────────────────────────────────────────
      - name: Check signing secrets
        id: guard
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RELEASE_KEYSTORE_BASE64 is not set — skipping the signed release. Add the four signing secrets to publish builds."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode keystore
        if: steps.guard.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - if: steps.guard.outputs.ready == 'true'
        name: Resolve signing alias
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "### Bansify Files v${{ steps.versioning.outputs.name }} signing" >> "$GITHUB_STEP_SUMMARY"

          ALIASES=$(keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" \
            | awk -F, '/PrivateKeyEntry/ {print $1}' | sed 's/PrivateKeyEntry//' | xargs -n1 | sort -u)

          CHOSEN=""
          if [ -n "${KEY_ALIAS_SECRET:-}" ] && echo "$ALIASES" | grep -qx "$KEY_ALIAS_SECRET"; then
            CHOSEN="$KEY_ALIAS_SECRET"
          elif [ -n "${KEY_ALIAS_SECRET:-}" ]; then
            echo "::warning::KEY_ALIAS '${KEY_ALIAS_SECRET}' is not in the keystore; using the first private key instead"
          fi
          [ -z "$CHOSEN" ] && CHOSEN=$(echo "$ALIASES" | head -1)

          if [ -z "$CHOSEN" ]; then
            echo "::error::the keystore contains no private key entry"
            keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" | tail -10
            exit 1
          fi

          echo "- alias: $CHOSEN" >> "$GITHUB_STEP_SUMMARY"
          echo "KEY_ALIAS=$CHOSEN" >> "$GITHUB_ENV"

      # ── Build ──────────────────────────────────────────────────────────────
      - if: steps.guard.outputs.ready == 'true'
        name: Build release APK and AAB
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease \
            -PversionName=${{ steps.versioning.outputs.name }} \
            -PversionCode=${{ steps.versioning.outputs.code }} \
            --no-daemon --stacktrace

      - if: steps.guard.outputs.ready == 'true'
        name: Collect artefacts
        run: |
          set -euo pipefail
          NAME="${{ steps.versioning.outputs.name }}"
          mkdir -p release_out
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -1)
          cp "$APK" "release_out/BansifyFiles-v${NAME}-Release.apk"
          [ -n "$AAB" ] && cp "$AAB" "release_out/BansifyFiles-v${NAME}-PlayStore.aab"
          cd release_out && sha256sum BansifyFiles-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - if: steps.guard.outputs.ready == 'true'
        name: Upload artefacts to the workflow
        uses: actions/upload-artifact@v4
        with:
          name: bansify-files-release
          path: release_out/*
          if-no-files-found: error

      - if: steps.guard.outputs.ready == 'true'
        name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versioning.outputs.name }}
          name: Bansify Files v${{ steps.versioning.outputs.name }}
          generate_release_notes: true
          files: release_out/*
          fail_on_unmatched_files: true
