name: Build Signed Release APK & Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 1.0.2 — leave empty for auto 1.0.X)'
        required: false
        default: ''
      version_code:
        description: 'Version code (integer — leave empty to auto-increment)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ── Version ────────────────────────────────────────────────────────────
      - name: Determine version
        id: versioning
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version_code }}" ]; then
            CODE="${{ inputs.version_code }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            CODE=""
          else
            CODE=""
          fi
          if [ -n "${{ inputs.version }}" ]; then
            NAME="${{ inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME=""
          fi
          if [ -z "$NAME" ]; then
            LAST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
            MAJOR=$(echo "${LAST#v}" | cut -d. -f1)
            MINOR=$(echo "${LAST#v}" | cut -d. -f2)
            PATCH=$(echo "${LAST#v}" | cut -d. -f3)
            NAME="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          if [ -z "$CODE" ]; then
            CODE=$(git rev-list --count HEAD)
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Releasing $NAME ($CODE)"

      # ── Signing material ───────────────────────────────────────────────────
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Print signing identity
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "### Bansify Files v${{ steps.versioning.outputs.name }} signing" >> "$GITHUB_STEP_SUMMARY"
          echo "- alias: ${KEY_ALIAS:-upload}" >> "$GITHUB_STEP_SUMMARY"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" | tail -3

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build release APK and AAB
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease \
            -PversionName=${{ steps.versioning.outputs.name }} \
            -PversionCode=${{ steps.versioning.outputs.code }} \
            --no-daemon --stacktrace

      - name: Collect artefacts
        run: |
          set -euo pipefail
          NAME="${{ steps.versioning.outputs.name }}"
          mkdir -p release_out
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -1)
          cp "$APK" "release_out/BansifyFiles-v${NAME}-Release.apk"
          [ -n "$AAB" ] && cp "$AAB" "release_out/BansifyFiles-v${NAME}-PlayStore.aab"
          cd release_out && sha256sum BansifyFiles-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Upload artefacts to the workflow
        uses: actions/upload-artifact@v4
        with:
          name: bansify-files-release
          path: release_out/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versioning.outputs.name }}
          name: Bansify Files v${{ steps.versioning.outputs.name }}
          generate_release_notes: true
          files: release_out/*
          fail_on_unmatched_files: true
