name: Quality checks

on:
  # every push, any branch
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

  docs:
    name: Documentation and repo hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Required files exist
        run: |
          missing=0
          for f in README.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md CHANGELOG.md LICENSE; do
            if [ ! -f "$f" ]; then echo "::error file=$f::missing required file"; missing=1; fi
          done
          for f in docs/ARCHITECTURE.md docs/BUILD.md docs/RELEASE.md docs/TROUBLESHOOTING.md; do
            if [ ! -f "$f" ]; then echo "::error file=$f::missing required file"; missing=1; fi
          done
          exit $missing

      - name: No secrets committed
        run: |
          if git ls-files | grep -Ei '\.(jks|keystore)$'; then
            echo "::error::a keystore is committed to the repository"; exit 1
          fi
          echo "no keystore committed"
